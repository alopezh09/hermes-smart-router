[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-smart-router"
version = "0.1.0"
description = "Dynamic model router plugin for Hermes Agent"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Alfonso López" }
]
keywords = ["hermes-agent", "plugin", "model-routing", "llm", "gateway"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/alopezh09/hermes-smart-router"
Repository = "https://github.com/alopezh09/hermes-smart-router"
Issues = "https://github.com/alopezh09/hermes-smart-router/issues"

[project.entry-points."hermes_agent.plugins"]
hermes-smart-router = "hermes_smart_router"

[tool.setuptools]
packages = ["hermes_smart_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
